customCommands:
  - key: "<c-t>"
    context: "localBranches"
    command: 'nvim -c "DiffviewOpen {{.SelectedLocalBranch.Name}}...{{.CheckedOutBranch.Name}} -- ."'
    description: "Open Diffview against selected branch"
    output: terminal
git:
  diffRenderers:
    - type: extDiff
      command: "difft --color=always --background=dark --display=side-by-side-show-both"
gui:
  sidePanelWidth: 0.15 # gives you more space to show things side-by-side
  border: "rounded"
  # TODO: port other options from config.yml
  theme:
    activeBorderColor:
      - "#f5a97f"
      - bold
    inactiveBorderColor:
      - "#a5adcb"
    optionsTextColor:
      - "#8aadf4"
    selectedLineBgColor:
      - "#363a4f"
    cherryPickedCommitBgColor:
      - "#494d64"
    cherryPickedCommitFgColor:
      - "#f5a97f"
    unstagedChangesColor:
      - "#f08a9a"
    defaultFgColor:
      - "#cad3f5"
    searchingActiveBorderColor:
      - "#eed49f"
  authorColors:
    "*": "#b7bdf8"
